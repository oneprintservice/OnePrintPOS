<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="icon" href="assets/logos.png">
<title>Tracking Servis · OnePrint</title>
<link rel="stylesheet" href="css/app.css">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="public-body">
<main class="track-page">
  <a class="back-link" href="index.html">← OnePrint Service</a>
  <div class="brand-large"><img src="assets/logos.png"><span>TRACKING<br><small>SERVICE</small></span></div>
  <div class="track-intro">
    <span class="eyebrow">STATUS PERBAIKAN</span>
    <h1>Lacak perangkat Anda.</h1>
    <p class="muted">Ketik nomor tanda terima atau scan QR pada nota untuk melihat status servis terbaru.</p>
  </div>

  <form id="form" class="track-form">
    <input id="search" autocomplete="off" placeholder="Contoh: TT-260922123456" aria-label="Nomor tanda terima">
    <button class="primary" type="submit">Cari</button>
    <button id="open-camera" class="secondary" type="button">▣ Scan QR</button>
  </form>

  <div id="scan-panel" class="track-scan-panel" hidden>
    <div class="track-scan-head">
      <div><strong>Scan QR Nota</strong><small>Arahkan kamera ke QR pada tanda terima / invoice.</small></div>
      <button id="close-camera" class="icon-btn" type="button" aria-label="Tutup kamera">×</button>
    </div>
    <div id="track-reader"></div>
    <p id="camera-status" class="muted">Menyiapkan kamera...</p>
  </div>

  <div id="result"></div>
</main>
<script type="module" src="js/tracking.js?v=20260930"></script>
</body>
</html>
